<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NOVA V2</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app" id="app">

    <header>
        <div class="logo">NOVA</div>
        <div class="status" id="status">● ONLINE</div>
    </header>

    <main>

        <div class="orb-container">
            <div class="orb"></div>
        </div>

        <h1 id="greeting">Hola, soy NOVA</h1>

        <p id="subtitle">
            Tu asistente personal
        </p>

        <div id="response">
            Decime algo para comenzar.
        </div>

    </main>

    <section class="controls">

        <button id="mic" class="mic">
            🎙️
        </button>

        <div class="input-area">

            <input
                id="textInput"
                type="text"
                placeholder="Hablale a NOVA..."
                autocomplete="off"
            >

            <button id="send">
                ➤
            </button>

        </div>

    </section>

    <footer>
        NOVA V2
    </footer>

</div>

<script src="app.js"></script>

</body>
</html>
