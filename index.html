<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NOVA V1</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 20%, #17234a 0%, #080b18 35%, #03040a 75%);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

.logo {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 4px;
}

.status {
    font-size: 12px;
    color: #7f8cff;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* ORB */

.orb-container {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
}

.orb {
    width: 145px;
    height: 145px;
    border-radius: 50%;

    background:
        radial-gradient(circle at 35% 30%,
        #ffffff 0%,
        #9ba7ff 8%,
        #5366ff 30%,
        #2433a7 60%,
        #080b24 100%);

    box-shadow:
        0 0 30px #5366ff,
        0 0 70px #3047ff,
        0 0 120px rgba(60,80,255,.5);

    animation: float 4s ease-in-out infinite;
}

.orb::before,
.orb::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(110,130,255,.5);
}

.orb::before {
    width: 185px;
    height: 185px;
    animation: rotate 8s linear infinite;
}

.orb::after {
    width: 215px;
    height: 215px;
    animation: rotateReverse 12s linear infinite;
}

.listening .orb {
    animation:
        pulse 1s infinite alternate,
        float 4s ease-in-out infinite;
}

.speaking .orb {
    animation:
        speak .45s infinite alternate,
        float 4s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.12); }
}

@keyframes speak {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

/* TEXT */

.greeting {
    text-align: center;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 8px;
}

.subtitle {
    color: #8d94aa;
    text-align: center;
    font-size: 15px;
    min-height: 22px;
}

/* RESPONSE */

.response {
    width: 100%;
    max-width: 500px;
    min-height: 55px;
    max-height: 150px;
    overflow-y: auto;
    text-align: center;
    margin-top: 15px;
    color: #dce0ff;
    font-size: 16px;
    line-height: 1.5;
}

/* CONTROLS */

.controls {
    padding: 15px 20px 30px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    align-items: center;
}

.mic {
    width: 75px;
    height: 75px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg,#6474ff,#2839c9);
    color: white;
    font-size: 28px;

    box-shadow:
        0 8px 30px rgba(53,70,255,.45);

    cursor: pointer;
    transition: .2s;
}

.mic:active {
    transform: scale(.92);
}

.listening .mic {
    background: #ff3b65;
    box-shadow:
        0 0 35px rgba(255,59,101,.7);
}

.input-area {
    width: 100%;
    max-width: 550px;
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    height: 48px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06);
    color: white;
    padding: 0 18px;
    outline: none;
    font-size: 16px;
}

.send {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: #5366ff;
    color: white;
    font-size: 19px;
}

/* FOOTER */

.footer {
    text-align: center;
    font-size: 11px;
    color: #555c73;
    padding-bottom: 8px;
}
</style>
</head>

<body>

<div class="app" id="app">

    <header class="header">
        <div class="logo">NOVA</div>
        <div class="status" id="status">● ONLINE</div>
    </header>

    <main class="main">

        <div class="orb-container">
            <div class="orb"></div>
        </div>

        <div class="greeting" id="greeting">
            Hola, soy NOVA
        </div>

        <div class="subtitle" id="subtitle">
            Tu asistente personal
        </div>

        <div class="response" id="response">
            Presioná el micrófono y hablame.
        </div>

    </main>

    <section class="controls">

        <button class="mic" id="mic">
            🎙️
        </button>

        <div class="input-area">
            <input
                id="textInput"
                type="text"
                placeholder="Escribile a NOVA..."
                autocomplete="off"
            >

            <button class="send" id="send">
                ➤
            </button>
        </div>

    </section>

    <div class="footer">
        NOVA V1 • Experimental
    </div>

</div>


<script>

/* =========================
   NOVA V1
========================= */

const app = document.getElementById("app");
const mic = document.getElementById("mic");
const response = document.getElementById("response");
const subtitle = document.getElementById("subtitle");
const greeting = document.getElementById("greeting");
const status = document.getElementById("status");

const textInput = document.getElementById("textInput");
const send = document.getElementById("send");


/* =========================
   VOZ
========================= */

let recognition = null;
let listening = false;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "es-AR";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {

        listening = true;

        app.classList.add("listening");

        subtitle.textContent = "Te estoy escuchando...";
        status.textContent = "● ESCUCHANDO";
    };

    recognition.onresult = (event) => {

        const text =
            event.results[0][0].transcript;

        processCommand(text);
    };

    recognition.onerror = () => {

        stopListening();

        speak("No pude escucharte correctamente.");
    };

    recognition.onend = () => {

        stopListening();
    };

} else {

    subtitle.textContent =
        "Tu navegador no permite reconocimiento de voz.";
}


/* =========================
   MICRÓFONO
========================= */

mic.addEventListener("click", () => {

    if (!recognition) {

        speak(
            "Tu navegador no permite reconocimiento de voz."
        );

        return;
    }

    if (listening) {

        recognition.stop();

    } else {

        recognition.start();
    }
});


function stopListening() {

    listening = false;

    app.classList.remove("listening");

    subtitle.textContent =
        "Tu asistente personal";

    status.textContent =
        "● ONLINE";
}


/* =========================
   TEXTO
========================= */

send.addEventListener("click", () => {

    const text = textInput.value.trim();

    if (!text) return;

    processCommand(text);

    textInput.value = "";
});


textInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {

        send.click();
    }
});


/* =========================
   PROCESAMIENTO
========================= */

function processCommand(text) {

    response.textContent = "Pensando...";

    const command = text.toLowerCase().trim();

    let answer = "";


    /* SALUDOS */

    if (
        command.includes("hola") ||
        command.includes("buenas")
    ) {

        answer =
            "Hola. Soy NOVA. ¿En qué puedo ayudarte?";

    }


    /* NOMBRE */

    else if (
        command.includes("cómo te llamas") ||
        command.includes("como te llamas") ||
        command.includes("quién eres") ||
        command.includes("quien eres")
    ) {

        answer =
            "Soy NOVA, tu asistente personal.";

    }


    /* HORA */

    else if (
        command.includes("qué hora") ||
        command.includes("que hora")
    ) {

        const now = new Date();

        answer =
            "Son las " +
            now.toLocaleTimeString(
                "es-AR",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }


    /* FECHA */

    else if (
        command.includes("qué día") ||
        command.includes("que dia") ||
        command.includes("fecha")
    ) {

        const now = new Date();

        answer =
            "Hoy es " +
            now.toLocaleDateString(
                "es-AR",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                }
            );

    }


    /* GOOGLE */

    else if (
        command.startsWith("buscar ") ||
        command.startsWith("busca ")
    ) {

        const query =
            text
                .replace(/^buscar /i, "")
                .replace(/^busca /i, "");

        answer =
            "Buscando " + query;

        speak(answer);

        setTimeout(() => {

            window.open(
                "https://www.google.com/search?q=" +
                encodeURIComponent(query),
                "_blank"
            );

        }, 700);

        return;
    }


    /* YOUTUBE */

    else if (
        command.startsWith("youtube ")
    ) {

        const query =
            text.replace(/^youtube /i, "");

        answer =
            "Buscando " + query + " en YouTube.";

        speak(answer);

        setTimeout(() => {

            window.open(
                "https://www.youtube.com/results?search_query=" +
                encodeURIComponent(query),
                "_blank"
            );

        }, 700);

        return;
    }


    /* CHISTE */

    else if (
        command.includes("chiste")
    ) {

        answer =
            "¿Por qué el programador usa lentes? Porque no puede ver C.";

    }


    /* GRACIAS */

    else if (
        command.includes("gracias")
    ) {

        answer =
            "De nada. Para eso estoy.";

    }


    /* APAGAR */

    else if (
        command.includes("callate") ||
        command.includes("cállate") ||
        command.includes("silencio")
    ) {

        speechSynthesis.cancel();

        answer = "Entendido.";

    }


    /* RESPUESTA GENERAL */

    else {

        answer =
            "Entendí: " +
            text +
            ". Todavía estoy aprendiendo. En la próxima versión voy a poder conectarme a una inteligencia artificial para responderte mucho mejor.";

    }


    response.textContent = answer;

    speak(answer);
}


/* =========================
   TEXT TO SPEECH
========================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {

        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "es-AR";
    utterance.rate = 1.0;
    utterance.pitch = 1.05;
    utterance.volume = 1;

    utterance.onstart = () => {

        app.classList.add("speaking");

        subtitle.textContent =
            "NOVA está hablando...";

        status.textContent =
            "● HABLANDO";
    };

    utterance.onend = () => {

        app.classList.remove("speaking");

        subtitle.textContent =
            "Tu asistente personal";

        status.textContent =
            "● ONLINE";
    };

    speechSynthesis.speak(utterance);
}


/* =========================
   INICIO
========================= */

window.addEventListener("load", () => {

    setTimeout(() => {

        speak(
            "Hola. Soy NOVA. Estoy lista."
        );

    }, 800);

});

</script>

</body>
</html>
